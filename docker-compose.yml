version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: learnexa-db
    environment:
      POSTGRES_USER: learnexa
      POSTGRES_PASSWORD: learnexa123
      POSTGRES_DB: learnexa_db
    ports:
      - "5433:5432"
    volumes:
      - learnexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnexa -d learnexa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  learnexa_pgdata:
